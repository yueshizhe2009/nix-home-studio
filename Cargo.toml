[workspace]
resolver = "2"
members = ["crates/nhs-adapter", "crates/nhs-app", "crates/nhs-core", "crates/nhs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yueshizhe2009/nix-home-studio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
similar = "2"
rnix = "0.14"
libc = "0.2"
toml = "0.8"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
todo = "deny"
unimplemented = "deny"
