# Curated package catalogue.
#
# What this file is: a small, offline, opinionated list of packages a beginner
# is likely to want, with the metadata a plain `nix search` does not give —
# licence, platform, and whether Nix will refuse it without an opt-in.
#
# What it is not: a mirror of nixpkgs. Every `attr` is an attribute path under
# `pkgs`, usable verbatim as `pkgs.<attr>`.
#
# Metadata policy
# ---------------
# * `license` is omitted when it could not be stated with confidence. An absent
#   licence is displayed as "unknown" and is never treated as "not allowed".
# * `platforms` is omitted when support is unknown — which means "show it", not
#   "hide it" (architecture §5.1). Otherwise it lists the systems this package is
#   known to build on.
# * `unfree` is set only where Nix itself refuses without `allowUnfree`.
# * The list is deliberately short. Padding it to a round number would mean
#   inventing metadata, which is worse than a smaller honest list.
format_version = 1

