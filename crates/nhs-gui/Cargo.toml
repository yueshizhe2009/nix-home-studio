[workspace]

[package]
name = "nhs-gui"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Nix Home Studio — the desktop application"

[dependencies]
nhs-adapter = { path = "../nhs-adapter" }
nhs-app = { path = "../nhs-app" }
nhs-core = { path = "../nhs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dev-dependencies]
sha2 = "0.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
todo = "deny"
unimplemented = "deny"
