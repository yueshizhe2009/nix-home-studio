[workspace]

[package]
name = "nhs-gui-spike-tauri"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
nhs-adapter = { path = "../nhs-adapter" }
nhs-app = { path = "../nhs-app" }
nhs-core = { path = "../nhs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
